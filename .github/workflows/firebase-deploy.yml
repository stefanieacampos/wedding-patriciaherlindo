name: Deploy para Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite rodar manualmente pelo GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependências das Functions
        run: cd functions && npm ci

      - name: Deploy no Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: wedding-patriciaherlindo
          channelId: live

      - name: Deploy Firestore Rules e Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore,storage,functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
