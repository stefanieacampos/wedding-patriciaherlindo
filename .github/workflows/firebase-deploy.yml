name: Deploy para Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências das Functions
        run: cd functions && npm ci

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Conceder permissão Service Usage à Service Account
        run: |
          SA_EMAIL=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['client_email'])")
          gcloud projects add-iam-policy-binding wedding-patriciaherlindo \
            --member="serviceAccount:${SA_EMAIL}" \
            --role="roles/serviceusage.serviceUsageConsumer" \
            --condition=None \
            --quiet || echo "Aviso: não foi possível conceder IAM (pode já existir)"

      - name: Deploy completo no Firebase
        run: npx firebase-tools deploy --only hosting --non-interactive --project wedding-patriciaherlindo
